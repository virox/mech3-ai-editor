[package]
name = "mech3-valve-switchboard"
version = "0.3.0"
edition = "2024"
license = "EUPL-1.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
