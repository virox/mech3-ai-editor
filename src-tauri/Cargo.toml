[package]
name = "mech3-ai-editor"
version = "0.3.1"
edition = "2024"
license = "EUPL-1.2"

[lib]
name = "mech3_ai_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
mech3ax-reader = { path = "C:/Dev/mech3ax/crates/reader" }
mech3ax-common = { path = "C:/Dev/mech3ax/crates/common" }
mech3ax-archive = { path = "C:/Dev/mech3ax/crates/archive" }
mech3ax-api-types = { path = "C:/Dev/mech3ax/crates/api-types" }
mech3ax-anim = { path = "C:/Dev/mech3ax/crates/anim" }
